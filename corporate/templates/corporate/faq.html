{% extends "base.html" %}
{% block title %}FAQ — AfraViva{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto px-4 py-16">
  <p class="font-mono text-xs uppercase tracking-widest text-gold-text mb-4">FAQ</p>
  <h1 class="font-serif text-3xl md:text-4xl font-semibold text-forest mb-10">Frequently asked questions</h1>

  <div class="divide-y divide-line border-y border-line">
    {% for item in faqs %}
      <div class="py-4" x-data="faqItem">
        <button @click="toggle"
                class="w-full text-left flex justify-between items-center font-medium text-ink">
          {{ item.question }}
          <span x-text="symbol" class="font-mono text-gold-text"></span>
        </button>
        <p x-show="open" x-cloak class="text-sm text-muted mt-2">{{ item.answer }}</p>
      </div>
    {% empty %}
      <p class="text-muted text-sm py-6">No FAQ items yet — add them from the admin.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
